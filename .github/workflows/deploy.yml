name: 🐳 CI/CD Pipeline - Dev Release

on:
  push:
    branches:
      - dev-release

jobs:
  docker-dev:
    name: 🐳 Build & Push Docker Image (Dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev-release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:dev-release .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:dev-release

  deploy:
    name: 🚀 Deploy Container to VPS
    needs: docker-dev
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Pulling latest Docker image..."
            docker pull ghcr.io/${{ github.repository }}:dev-release

            echo "Stopping old container if running..."
            docker stop myapp || true

            echo "Removing old container if exists..."
            docker rm myapp || true

            echo "Starting new container..."
            docker run -d -p 80:80 --name myapp ghcr.io/${{ github.repository }}:dev-release
